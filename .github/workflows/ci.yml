name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  LLM_PROVIDER: offline
  ENABLE_WEB_TOOLS: "false"
  GETNET_TODAY: "2026-10-30"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit + integration tests
        run: pytest -q
      - name: Evaluation gate (routing >= 90%)
        run: python evals/run_evals.py --min-routing 0.90
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/results/*.json
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t getnet-agents .
      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 -e LLM_PROVIDER=offline getnet-agents
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && break; sleep 1; done
          curl -fsS -X POST localhost:8000/chat -H 'Content-Type: application/json' \
            -d '{"message":"Can I sell through WhatsApp using the Payment Link?","user_id":"cliente1988"}'
          docker rm -f api
