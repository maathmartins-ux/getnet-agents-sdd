services:
  api:
    build: .
    image: getnet-agents:latest
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-offline}
      ENABLE_WEB_TOOLS: ${ENABLE_WEB_TOOLS:-true}
    restart: unless-stopped

  # docker compose --profile test run --rm test
  test:
    profiles: ["test"]
    build: .
    image: getnet-agents:latest
    environment:
      LLM_PROVIDER: offline
      ENABLE_WEB_TOOLS: "false"
    command: ["sh", "-c", "pytest -q && python evals/run_evals.py"]
